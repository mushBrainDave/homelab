---
# DIY ratgdo on a Seeed XIAO ESP32S3
# Opener: Craftsman 139.54985 (yellow learn button = Security+ 2.0)
# Based on ratgdo/esphome-ratgdo static/v32board.yaml

substitutions:
  id_prefix: garage_door
  friendly_name: "Garage Door"
  # Wired to the opener (through the level-shifting circuit)
  uart_tx_pin: GPIO1        # D0 -> MOSFET gate, pulls red control wire low
  uart_rx_pin: GPIO2        # D1 <- divider from red control wire
  input_obst_pin: GPIO4     # D3 <- divider from safety-sensor wire
  # Required by base.yaml but not wired (auxiliary outputs / dry-contact inputs)
  status_door_pin: GPIO6         # D5
  status_obstruction_pin: GPIO7  # D8
  dry_contact_open_pin: GPIO8    # D9
  dry_contact_close_pin: GPIO9   # D10
  dry_contact_light_pin: GPIO44  # D7

esphome:
  name: garage-door
  friendly_name: ${friendly_name}
  min_version: 2026.4.0

esp32:
  variant: esp32s3
  board: seeed_xiao_esp32s3
  framework:
    type: esp-idf

packages:
  remote_package:
    url: https://github.com/ratgdo/esphome-ratgdo
    ref: main
    files: [base.yaml]
    refresh: 1d

# Onboard user LED (active low)
switch:
  - platform: ratgdo
    id: ${id_prefix}_led
    type: led
    pin:
      number: GPIO21
      inverted: true
    name: "LED"
    entity_category: config

sensor:
  - platform: wifi_signal
    name: "WiFi Signal"
    update_interval: 120s

time:
  - platform: homeassistant
    id: homeassistant_time

# base.yaml defines this OTA entry with no password; extend it to add one
ota:
  - id: !extend garage_door_ratgdo_ota
    password: !secret ota_password

web_server:
  local: true

api:
  id: api_server
  encryption:
    key: !secret api_encryption_key

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "garage-door-fallback"

captive_portal:

improv_serial:

# Native USB (USB-Serial/JTAG) is the default on the S3
logger:
