# Template for secrets/secrets.sops.yaml (the real one is git-ignored + SOPS-encrypted).
# Create the real file with:
#   cp secrets/secrets.sops.example.yaml secrets/secrets.sops.yaml
#   sops -e -i secrets/secrets.sops.yaml
# Thereafter edit with:  sops secrets/secrets.sops.yaml
#
# Everything below is a PLACEHOLDER — no real secrets in the example.

forms:
  ANTHROPIC_API_KEY: sk-ant-REPLACE_ME

mosquitto:
  # Currently the broker runs allow_anonymous=true (no creds). When you lock it
  # down, put the credentials here and wire them into the mosquitto role + the
  # frigate config + the HA MQTT integration.
  username: frigate
  password: REPLACE_ME

proxmox:
  # For Terraform's bpg/proxmox provider (API token is safer than root password)
  api_token_id: "terraform@pve!iac"
  api_token_secret: REPLACE_ME
