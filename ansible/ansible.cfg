[defaults]
inventory = inventory.yml
roles_path = roles
host_key_checking = True
retry_files_enabled = False
interpreter_python = auto_silent
stdout_callback = yaml

[privilege_escalation]
become = False
become_ask_pass = True
# Sudo requires a password on every host (except `apt update`). Run playbooks
# with -K so become tasks can authenticate. See roles/common for the convention.
