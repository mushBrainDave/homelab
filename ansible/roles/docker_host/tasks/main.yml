---
# Installs Docker CE on the ubuntu host and deploys the compose stacks that
# live in this repo (docker/frigate, docker/forms).
- name: Install prerequisites
  ansible.builtin.apt:
    name: [ca-certificates, curl, gnupg]
    state: present
    update_cache: true
  become: true

- name: Add Docker GPG key
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: "0644"
  become: true

- name: Add Docker apt repo
  ansible.builtin.apt_repository:
    repo: "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
    state: present
  become: true

- name: Install Docker engine + compose plugin
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-compose-plugin
    state: present
    update_cache: true
  become: true

# The compose files are synced from this repo. `frigate` is a public image;
# `forms` is a locally-built image published by the Actions runner (see README).
- name: Sync compose stacks to the host
  ansible.posix.synchronize:
    src: "../../docker/{{ item }}/"
    dest: "/home/{{ ansible_user }}/stacks/{{ item }}/"
  loop:
    - frigate
    - forms

- name: Render forms .env from SOPS (manual step reminder)
  ansible.builtin.debug:
    msg: >-
      Ensure /home/{{ ansible_user }}/stacks/forms/.env exists (render from
      secrets.sops.yaml). Never commit it. Then: docker compose up -d
