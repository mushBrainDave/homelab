---
# Proxmox host (pve) specifics.

# Persist the NIC hardware-offload fix that stops the intermittent
# "Corrupted MAC on input" SSH corruption to guests (notably the HAOS VM).
# Applies at boot via a post-up hook on the vmbr0 bridge.
- name: Persist nic0 offload-disable on vmbr0
  ansible.builtin.lineinfile:
    path: /etc/network/interfaces
    insertafter: '^iface vmbr0 inet'
    line: "        post-up /usr/sbin/ethtool -K nic0 gso off gro off tso off tx off rx off sg off"
    state: present
  become: true

- name: Apply offload settings now (idempotent, harmless if already set)
  ansible.builtin.command:
    cmd: ethtool -K nic0 gso off gro off tso off tx off rx off sg off
  become: true
  changed_when: false

# WAN bridge for the OPNsense VM on the Intel I226-V (enp131s0).
# No host IP: pve must not be reachable from the Nokia side.
# Lives in /etc/network/interfaces (not interfaces.d) so the Proxmox GUI lists it.
# The GUI rewrites this file and may drop the block markers, so only add the
# block when no vmbr1 stanza exists at all.
- name: Check for an existing vmbr1 stanza
  ansible.builtin.command:
    cmd: grep -q '^iface vmbr1' /etc/network/interfaces
  register: vmbr1_present
  changed_when: false
  check_mode: false   # read-only; must run in --check so the next task can use .rc
  failed_when: vmbr1_present.rc > 1

- name: Add vmbr1 (OPNsense WAN) bridge
  ansible.builtin.blockinfile:
    path: /etc/network/interfaces
    insertbefore: '^source /etc/network/interfaces.d'
    marker: "# {mark} ANSIBLE vmbr1 (OPNsense WAN)"
    # Tab-indented to match the stanzas Proxmox writes.
    block: "iface enp131s0 inet manual\n\nauto vmbr1\niface vmbr1 inet manual\n\tbridge-ports enp131s0\n\tbridge-stp off\n\tbridge-fd 0\n"
    backup: true
  become: true
  when: vmbr1_present.rc == 1
  register: vmbr1_block

- name: Bring up vmbr1 (ifupdown2 only applies the diff; vmbr0 is untouched)
  ansible.builtin.command:
    cmd: /usr/sbin/ifreload -a
  become: true
  when: vmbr1_block is changed
