---
# Full-fleet convergence. Run: ansible-playbook site.yml -K
# Target one group: ansible-playbook site.yml -K --limit docker_hosts

- name: Proxmox host
  hosts: proxmox
  # Configure the no-subscription APT repos FIRST — the common role runs
  # `apt update`, which fails on a fresh host while the enterprise repos are
  # still enabled (401 Unauthorized).
  pre_tasks:
    - name: Configure Proxmox APT repositories
      ansible.builtin.import_role:
        name: proxmox
        tasks_from: repos
  roles:
    - common
    - proxmox

- name: MQTT broker
  hosts: brokers
  roles:
    - common
    - mosquitto

- name: DNS (Pi-hole)
  hosts: dns
  roles:
    - common
    - pihole

- name: Ubuntu application host
  hosts: docker_hosts
  roles:
    - common
    - docker_host
    - mediamtx
    - pocketbase
    - nginx
