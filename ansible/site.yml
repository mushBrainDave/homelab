---
# Full-fleet convergence. Run: ansible-playbook site.yml -K
# Target one group: ansible-playbook site.yml -K --limit docker_hosts

- name: Proxmox host
  hosts: proxmox
  # Configure the no-subscription APT repos FIRST — the common role runs
  # `apt update`, which fails on a fresh host while the enterprise repos are
  # still enabled (401 Unauthorized).
  pre_tasks:
    - name: Configure Proxmox APT repositories
      ansible.builtin.import_role:
        name: proxmox
        tasks_from: repos
  roles:
    - common
    - proxmox

- name: MQTT broker
  hosts: brokers
  roles:
    - common
    - mosquitto

- name: DNS (Pi-hole)
  hosts: dns
  roles:
    - common
    - pihole

- name: Omada controller
  hosts: controllers
  # The Debian LXC template ships without sudo (common's sudoers drop-in
  # needs visudo) and may lack python3.
  gather_facts: false
  pre_tasks:
    - name: Bootstrap python3 and sudo
      ansible.builtin.raw: >-
        command -v python3 >/dev/null && command -v sudo >/dev/null ||
        (apt-get update && apt-get install -y python3 sudo)
      register: omada_bootstrap
      changed_when: "'Setting up' in omada_bootstrap.stdout"
    - name: Gather facts
      ansible.builtin.setup:
  roles:
    - common
    - omada

- name: Ubuntu application host
  hosts: docker_hosts
  roles:
    - common
    - docker_host
    # In-guest NVIDIA driver + container-toolkit + Docker runtime, needed for
    # Frigate's tensorrt/CUDA path. Runs only where nvidia_gpu is true (prod
    # ubuntu host); a no-op on GPU-less boxes like the test env.
    - role: nvidia
      when: nvidia_gpu | default(false)
    - mediamtx
    - pocketbase
    - nginx
